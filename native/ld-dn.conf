# deb-native ld-dn runtime policy.
#
# Read by native/ld-dn.c on every translated Debian program, before glibc's
# loader runs. Installed to $DN/etc/deb-native/ld-dn.conf by
# scripts/install/setup-runtime.sh. This file is the source of truth for an
# installed prefix; ld-dn's compiled defaults are a bootstrap fallback for
# when the file is absent, and must be kept in sync with it
# (tests/ld-dn-config/run.sh asserts both paths agree).
#
# Full reference: docs/spec/ld-dn-config.md.
#
# Grammar (one directive per line, '#' starts a comment; a line that does
# not fit is warned about and skipped, never fatal):
#   loader PATH              glibc loader to jump to (prefix-relative)
#   lib-add PATH             append a library search dir
#   no-default-lib           drop the compiled default lib dirs first
#   preload PATH             append an LD_PRELOAD library (after the default)
#   no-default-preload       drop the built-in path-redirect.so
#   env KEY=VALUE            set/replace an env entry; $DN expands to the prefix
#   unset NAME [NAME...]     drop these from the inherited environment
#   shim-prefix /a /b ...    redirect roots passed to the shim (DN_REDIRECT_PREFIXES)
#   [name]                   following directives apply only to that program
#                            (basename, or a full path ending in '/name')
#
# Global directives must come before the first [name] block; after it, a
# directive belongs to the current block.
#
# Paths in loader/lib-add/preload are inside the prefix: a leading '/' is the
# Debian path, so `/usr/lib` here means $DN/usr/lib.

loader /usr/lib/ld-linux-aarch64.so.1

no-default-lib
lib-add /usr/lib/aarch64-linux-gnu
lib-add /usr/lib

no-default-preload
preload /usr/lib/deb-native/path-redirect.so

env COMPILER_PATH=$DN/usr/bin
unset LD_PRELOAD
unset DN_INSTDIR
unset LD_LIBRARY_PATH
unset COMPILER_PATH

# Redirect roots the shim rewrites into the prefix. Active here so the
# config, not the shim's compiled switch, is the source; the compiled set is
# the same and only stands in when this file is absent.
shim-prefix /usr /etc /var /opt /root /lib /bin /sbin

# Per-program overrides, example shape:
# [git]
# env GIT_EXEC_PATH=$DN/usr/lib/git-core
# preload /usr/lib/deb-native/git-helper.so
