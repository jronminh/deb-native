name: Bug report
description: Something installed wrong, ran wrong, or broke.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Most bugs here come down to the prefix state
        and how a program was run, so the fields below matter. Please check
        [known issues](https://github.com/jronminh/deb-native/blob/main/docs/reference/known-issues.md)
        first — it may already be documented with a workaround.
  - type: input
    id: version
    attributes:
      label: deb-native version / commit
      description: The release tag, or the output of `git rev-parse --short HEAD`.
      placeholder: v0.6.0+s.1-prealpha
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version, Termux source
      placeholder: Pixel 7, Android 14; Termux from F-Droid v0.118
    validations:
      required: true
  - type: input
    id: prefix
    attributes:
      label: Prefix path
      description: Usually `~/.dn`; inside the userland it is `$DN_INSTDIR`.
      placeholder: ~/.dn
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran, and what happened
      description: The exact command, the result, and what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: termux-dn-doctor output
      description: Run `termux-dn-doctor` in the userland (from a host shell, `termux-shell` first) and paste the whole result.
      render: text
    validations:
      required: false
  - type: textarea
    id: state
    attributes:
      label: Package state
      description: For a single package, paste `dpkg -l <package>` — the `ii`/`iF` status column is the thing to watch.
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or log
      description: The error text, or the tail of `~/.dn/var/log/deb-native-install-*.log`.
      render: text
    validations:
      required: false
