name: Build the runtime

# Builds the runtime side of deb-native on an arm64 Linux runner:
#   - dn-trace, the tree's root process (the syscall catalog embedded in it),
#     linked static against a stock glibc so a poor host can start it with a
#     bare exec and no loader at all.
# It is an artifact for build-prefix.yml -- not a release of its own; the one
# published release is `prefix`, from build-prefix.yml (docs/spec/prefix.md).
#
# No glibc is built or patched here.  The tree takes Debian's own stock
# `libc6`/`libc-bin` from the mirror (`scripts/build/packages.tsv`), and the
# syscalls Android denies are answered at the syscall boundary by dn-trace,
# not by a patched glibc (docs/reference/android-platform.md, "Stock `libc6`
# re-tested").

on:
  workflow_dispatch: {}
  workflow_call: {}

env:
  GLIBC_DEB_VERSION: "2.41-12+deb13u4"
  DEB_URL: "https://deb.debian.org/debian/pool/main/g/glibc"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make xz-utils

      # `libc6-dev` supplies the static start files and `libc.a`; the arm64
      # payload comes straight from Debian's own .deb.  dn-trace is the
      # outermost process -- nothing traces it -- so it is linked static.  Its
      # own startup only needs `rseq` off, which the supported glibc tunable
      # `GLIBC_TUNABLES=glibc.pthread.rseq=0` does; the artifact's contract
      # entry sets it where it launches dn-trace.
      - name: Fetch Debian's stock libc6-dev
        run: |
          mkdir -p pkgs libcdev
          curl -fsSL -o pkgs/libc6-dev.deb \
            "${DEB_URL}/libc6-dev_${GLIBC_DEB_VERSION}_arm64.deb"
          dpkg-deb -x pkgs/libc6-dev.deb libcdev
          test -f libcdev/usr/lib/aarch64-linux-gnu/libc.a
          test -f libcdev/usr/lib/aarch64-linux-gnu/crt1.o

      - name: Build the runtime (dn-trace, static)
        run: |
          DN_GLIBC_LIBC_DIR="$GITHUB_WORKSPACE/libcdev/usr/lib/aarch64-linux-gnu" \
            scripts/build/build-trace.sh

      # The branch's runtime is three files, not one: dn-trace (the monitor's
      # root), dn-interp (the *loader launcher* -- the exec gate's rule-3
      # target, which builds the environment and execve()s the tree's stock
      # ld.so) and dn-shim.so (the in-process fast path, delivered by
      # dn-interp's conf).  All three land in the one artifact.
      - name: Build the interpreter and the shim
        run: |
          scripts/build/build-interp.sh src/.build-runtime
          scripts/build/build-shim.sh src/.build-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: dn-runtime
          path: src/.build-runtime/
          include-hidden-files: true
          retention-days: 14
