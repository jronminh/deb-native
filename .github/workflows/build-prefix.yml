name: Build the prefix tarballs

# Builds core-deb and core-ultra on an arm64 runner, from source, and attaches
# both tarballs to the rolling `prefix` release (no version in the name).
#
# This workflow does NOT build glibc: the tree takes Debian's own stock
# libc6/libc-bin from the mirror (scripts/build/packages.tsv). Here we consume
# the `dn-runtime` artifact of one build-runtime run (the one that triggered
# this, or the newest successful), so nothing comes from a stale release or a
# developer machine:
#   - the runtime: dn-trace, static against a stock libc.a;
#   - the package set: scripts/build/packages.tsv (pinned) + profile.txt,
#     fetched from the Debian mirror.
# core-deb is built on an EMPTY base (build-core-deb.sh writes the loader
# configuration itself); core-ultra is cut from the core-deb tree.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Build the runtime"]
    types: [completed]

env:
  # The artifact root baked into the tarballs (PT_INTERP).
  PREFIX_ROOT: "/data/local/deb-native"
  RUNTIME_WORKFLOW: "build-runtime.yml"

jobs:
  prefix:
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 wget xz-utils dpkg

      - name: Take the runtime (one build-runtime run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ github.event.workflow_run.id }}"
          if [ -z "$run" ]; then
            run=$(gh run list --workflow "$RUNTIME_WORKFLOW" --status success -L1 \
                    --json databaseId --jq '.[0].databaseId')
          fi
          echo "runtime from build-runtime run $run"
          gh run download "$run" -n dn-runtime -D src/.build-runtime
          # An artifact does not keep the executable bit.
          chmod 755 src/.build-runtime/dn-trace

      - name: Build core-deb on an empty base
        env:
          DN_RUNTIME: ${{ github.workspace }}/src/.build-runtime
          PREFIX_ROOT: ${{ env.PREFIX_ROOT }}
          DEB_LIST: ${{ github.workspace }}/scripts/build/packages.tsv
          DN_PROFILE: ${{ github.workspace }}/scripts/build/profile.txt
          DEB_CACHE: ${{ github.workspace }}/deb-cache
          STAGE_OUT: ${{ github.workspace }}/cdb-tree
        run: |
          mkdir -p empty-base
          sh scripts/build/build-core-deb.sh "$PWD/empty-base" "$PWD/core-deb.tar.gz"

      - name: Cut core-ultra from the core-deb tree
        run: |
          python3 scripts/build/cut-core-ultra.py cdb-tree core-ultra-tree
          scripts/build/package-prefix.sh core-ultra-tree \
            --root "$PREFIX_ROOT" --name core-ultra \
            --desc "core-ultra: the minimal prefix -- stock glibc, shell, basic tools" \
            --out core-ultra.tar.gz

      - name: Show the version manifest
        run: |
          for t in core-deb.tar.gz core-ultra.tar.gz; do
            echo "== $t =="
            tar -xzOf "$t" ./boot/version
            tar -tzf "$t" | grep -q '^\./boot/boot\.sh$'
            tar -tzf "$t" | grep -q '^\./boot/install\.sh$'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prefix-tarballs
          path: |
            core-deb.tar.gz
            core-ultra.tar.gz
          retention-days: 14

      - name: Publish to the rolling `prefix` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prefix >/dev/null 2>&1 || \
            gh release create prefix --prerelease \
              --title "deb-native prefix (rolling)" \
              --notes "core-deb and core-ultra, built from source by .github/workflows/build-prefix.yml."
          gh release upload prefix core-deb.tar.gz core-ultra.tar.gz --clobber
