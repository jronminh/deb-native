name: Build the prefix tarballs

# Builds core-deb and core-ultra on an arm64 runner, from source, and attaches
# both tarballs to the rolling `prefix` release (no version in the name).
#
# This workflow does NOT build glibc: the patched glibc (the 10 files that are
# swapped over Debian's libc6/libc-bin -- the two packages themselves are
# UNPATCHED and unusable on Android) is produced by build-glibc.yml, from
# Debian's own glibc source. Here we consume the freshest `dn-glibc-bundle`
# artifact that workflow left, so nothing comes from a stale release or a
# developer machine:
#   - the runtime overlay: scripts/build/build-overlay-glibc.sh (plain gcc);
#   - the patched glibc: build-glibc.yml's newest dn-glibc-bundle artifact;
#   - the package set: scripts/build/packages.tsv (pinned) + profile.txt,
#     fetched from the Debian mirror.
# core-deb is built on an EMPTY base (build-core-deb.sh writes the loader
# configuration itself); core-ultra is cut from the core-deb tree.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Build the glibc runtime"]
    types: [completed]

env:
  # The artifact root baked into the tarballs (PT_INTERP). It must differ from
  # the glibc build's DN_PREFIX placeholder (see build-glibc.yml).
  PREFIX_ROOT: "/data/local/deb-native"
  GLIBC_WORKFLOW: "build-glibc.yml"

jobs:
  prefix:
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtalloc-dev python3 wget xz-utils dpkg

      - name: Take the patched glibc (freshest build-glibc bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ github.event.workflow_run.id }}"
          if [ -z "$run" ]; then
            run=$(gh run list --workflow "$GLIBC_WORKFLOW" --status success -L1 \
                    --json databaseId --jq '.[0].databaseId')
          fi
          echo "glibc bundle from build-glibc run $run"
          gh run download "$run" -n dn-glibc-bundle -D .
          mkdir -p bundle
          tar -xzf dn-glibc-bundle.tar.gz -C bundle
          test -x bundle/files/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1

      - name: Build the runtime overlay
        run: scripts/build/build-overlay-glibc.sh

      - name: Build core-deb on an empty base
        env:
          DN_GLIBC_PREFIX: ${{ github.workspace }}/bundle/files
          DN_OVERLAY: ${{ github.workspace }}/src/.build-glibc
          PREFIX_ROOT: ${{ env.PREFIX_ROOT }}
          DEB_LIST: ${{ github.workspace }}/scripts/build/packages.tsv
          DN_PROFILE: ${{ github.workspace }}/scripts/build/profile.txt
          DEB_CACHE: ${{ github.workspace }}/deb-cache
          STAGE_OUT: ${{ github.workspace }}/cdb-tree
        run: |
          mkdir -p empty-base
          sh scripts/build/build-core-deb.sh "$PWD/empty-base" "$PWD/core-deb.tar.gz"

      - name: Cut core-ultra from the core-deb tree
        run: |
          python3 scripts/build/cut-core-ultra.py cdb-tree core-ultra-tree
          scripts/build/package-prefix.sh core-ultra-tree \
            --root "$PREFIX_ROOT" --name core-ultra \
            --desc "core-ultra: the minimal prefix -- patched glibc, shell, basic tools" \
            --out core-ultra.tar.gz

      - name: Show the contracts
        run: |
          for t in core-deb.tar.gz core-ultra.tar.gz; do
            echo "== $t =="
            tar -xzOf "$t" ./.dn/contract
            tar -tzf "$t" | grep -q '^\./\.dn/install\.sh$'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prefix-tarballs
          path: |
            core-deb.tar.gz
            core-ultra.tar.gz
          retention-days: 14

      - name: Publish to the rolling `prefix` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prefix >/dev/null 2>&1 || \
            gh release create prefix --prerelease \
              --title "deb-native prefix (rolling)" \
              --notes "core-deb and core-ultra, built from source by .github/workflows/build-prefix.yml."
          gh release upload prefix core-deb.tar.gz core-ultra.tar.gz --clobber
