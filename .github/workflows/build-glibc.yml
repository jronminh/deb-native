name: Build own-glibc (test)

# Manual, exploratory build for 0.5.0's own-glibc milestone (see TODO.md).
# Builds Debian's real glibc source + this project's Android patch
# (patches/dn-glibc-android.patch) on a real
# aarch64 Linux runner -- sidesteps the Termux/clang blocker found on-device
# (glibc's configure requires a GCC-only builtin-redirection behavior clang
# has never implemented; no real GCC cross-toolchain exists in Termux).
# Output is a tarball artifact to copy onto a phone and test through the
# existing ld-dn + shim pipeline -- this workflow does not run on Android
# and proves nothing about runtime behavior there, only that the patched
# source configures and builds.

on:
  workflow_dispatch: {}

env:
  GLIBC_VERSION: "2.41"
  GLIBC_DEB_VERSION: "2.41-12+deb13u4"
  DN_PREFIX: "/data/data/com.termux/files/home/.dn"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential quilt bison gawk gettext python3 \
            xz-utils file rdfind symlinks netbase gperf texinfo

      - name: Fetch Debian's real glibc source
        run: |
          mkdir -p src
          cd src
          curl -sLO "https://deb.debian.org/debian/pool/main/g/glibc/glibc_${GLIBC_VERSION}.orig.tar.xz"
          curl -sLO "https://deb.debian.org/debian/pool/main/g/glibc/glibc_${GLIBC_DEB_VERSION}.debian.tar.xz"

      - name: Extract and apply Debian's own patch series
        run: |
          cd src
          tar xf "glibc_${GLIBC_VERSION}.orig.tar.xz"
          mv "glibc-${GLIBC_VERSION}" work
          tar xf "glibc_${GLIBC_DEB_VERSION}.debian.tar.xz" -C work
          cd work
          QUILT_PATCHES=debian/patches quilt push -a

      - name: Apply this project's Android patch
        run: |
          scripts/glibc/dn-apply-glibc-patch.sh src/work "${DN_PREFIX}"

      - name: Configure
        run: |
          mkdir -p objdir
          cd objdir
          ../src/work/configure \
            --prefix="${DN_PREFIX}/usr" \
            --libdir="${DN_PREFIX}/usr/lib" \
            --includedir="${DN_PREFIX}/usr/include" \
            --host=aarch64-linux-gnu \
            --build=aarch64-linux-gnu \
            --enable-memory-tagging \
            --enable-fortify-source \
            --enable-bind-now \
            --disable-multi-arch \
            --enable-stack-protector=strong \
            --disable-nscd \
            --disable-profile \
            --disable-werror \
            --disable-default-pie

      - name: Build
        run: |
          cd objdir
          make -O -j"$(nproc)"

      - name: Install to a staging tree
        run: |
          cd objdir
          mkdir -p "$GITHUB_WORKSPACE/destdir"
          # Debian's glibc source package omits the manual's texinfo
          # sources entirely (unrelated to the Android patch --
          # src/work/manual/ has only a Makefile after extraction, dozens
          # of chapters/scripts missing). We don't need the manual, but two
          # attempts to make Make skip it cleanly both backfired:
          # - editing Makeconfig's 'subdirs' assignment made the preceding
          #   'make' (build) step 5-8x slower for reasons not tracked down;
          # - a computed 'subdirs=' override on 'make install' (querying
          #   the real list via a throwaway target, filtering 'manual' out
          #   in the shell) silently produced a much SHORTER list than
          #   intended -- the installed tree came out missing ld.so, NSS
          #   modules, locale data, most headers, just a handful of files.
          # Without -k, Make aborts the WHOLE recursive install the moment
          # 'manual' fails -- any subdir that would have run after it in
          # the sequence never runs at all (wrongly assumed otherwise in
          # an earlier version of this comment; the truncated log only
          # LOOKED like 'manual' was last because that's where make stops
          # printing). -k (keep-going) makes it attempt every subdir
          # regardless, so only 'manual' itself is missing from the result.
          make -k install DESTDIR="$GITHUB_WORKSPACE/destdir" || true
          test -f "$GITHUB_WORKSPACE/destdir${DN_PREFIX}/usr/lib/libc.so.6"
          test -e "$GITHUB_WORKSPACE/destdir${DN_PREFIX}/usr/lib/ld-linux-aarch64.so.1"

      - name: Package artifact
        run: |
          tar -C destdir -czf dn-glibc-android-${{ github.sha }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: dn-glibc-android
          path: dn-glibc-android-${{ github.sha }}.tar.gz
          retention-days: 14

      # The install bundle (DN_GLIBC_DEBS): the 10 patched files laid out
      # relative to a prefix, Debian's own libc6/libc-bin to install first,
      # and the shim built against this build's glibc.  setup-apt-prefix.sh
      # downloads it from the rolling release when DN_GLIBC_DEBS is unset.
      - name: Assemble the install bundle
        run: |
          set -eu
          P="$GITHUB_WORKSPACE/destdir${DN_PREFIX}"
          B="$GITHUB_WORKSPACE/bundle"
          rm -rf "$B"
          mkdir -p "$B/files/usr/lib/aarch64-linux-gnu" "$B/files/usr/sbin" "$B/files/usr/bin"
          for f in libc.so.6 ld-linux-aarch64.so.1 libresolv.so.2 libnsl.so.1 \
                   libnss_compat.so.2 libnss_hesiod.so.2 librt.so.1; do
            cp -a "$P/usr/lib/$f" "$B/files/usr/lib/aarch64-linux-gnu/$f"
          done
          cp -a "$P/usr/sbin/ldconfig" "$B/files/usr/sbin/"
          cp -a "$P/usr/bin/localedef" "$P/usr/bin/iconv" "$B/files/usr/bin/"
          cd "$B"
          curl -sLO "https://deb.debian.org/debian/pool/main/g/glibc/libc6_${GLIBC_DEB_VERSION}_arm64.deb"
          curl -sLO "https://deb.debian.org/debian/pool/main/g/glibc/libc-bin_${GLIBC_DEB_VERSION}_arm64.deb"
          mv libc6_*.deb libc6.deb
          mv libc-bin_*.deb libc-bin.deb
          # Build the shim with the runner's toolchain: the installed glibc
          # header set is incomplete (no gnu/stubs-lp64.h), and the shim only
          # uses old libc symbols, satisfied by the prefix's 2.41 at runtime.
          gcc -O2 -fPIC -shared \
            -o dn-shim.so "$GITHUB_WORKSPACE/src/dn-shim.c" -ldl
          tar -C "$B" -czf "$GITHUB_WORKSPACE/dn-glibc-bundle.tar.gz" .

      - name: Publish the bundle to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view glibc-bundle >/dev/null 2>&1 || \
            gh release create glibc-bundle --prerelease \
              --title "dn-glibc install bundle (rolling)" \
              --notes "Rolling bundle for setup-apt-prefix.sh: the 10 patched glibc files, Debian's libc6/libc-bin, and the shim. Built by .github/workflows/build-glibc.yml."
          gh release upload glibc-bundle dn-glibc-bundle.tar.gz --clobber
